plugins { id 'com.android.application' }

// Release signing is intentionally configured from environment variables.
// Do not commit your .jks/.keystore file to GitHub.
def releaseStoreFile = System.getenv("KEYSTORE_FILE")
def releaseStorePassword = System.getenv("KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("KEY_ALIAS")
def releaseKeyPassword = System.getenv("KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def habbodexProxyKey = System.getenv("HABBODEX_PROXY_KEY") ?: (project.findProperty("HABBODEX_PROXY_KEY") ?: "")
def escapedHabbodexProxyKey = habbodexProxyKey.toString().replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.toxic.search'
    compileSdk 36

    defaultConfig {
        applicationId 'com.toxic.search'
        minSdk 23
        targetSdk 36
        versionCode 86
        versionName '1.4.1'
        buildConfigField 'String', 'HABBODEX_PROXY_KEY', "\"${escapedHabbodexProxyKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // O idioma da interface acompanha o hotel escolhido dentro do app.
    // Mantém todos os idiomas no APK-base entregue pelo Google Play.
    bundle {
        language {
            enableSplit = false
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Development APKs must never request production ads.
            buildConfigField 'boolean', 'UNITY_USE_TEST_ADS', 'true'
        }
        release {
            // Google Play / production builds use the real Unity ad units.
            buildConfigField 'boolean', 'UNITY_USE_TEST_ADS', 'false'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.18.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.unity3d.ads:unity-ads:4.19.0'
    implementation 'com.android.billingclient:billing:9.1.0'
}
